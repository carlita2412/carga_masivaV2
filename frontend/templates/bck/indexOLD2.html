<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carga Masiva</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <!--<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>-->
 
  <!-- Select2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

  <!-- jQuery (requerido por Select2) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- Select2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            margin-top: 3rem;
            box-shadow: 0 0.25rem 0.5rem rgba(0, 0, 0, 0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            height: 50px;
        }
        footer{
        background-color: #2D3748 !important;
        color: white !important;
    }
    .digisalud-header {
      background: linear-gradient(to right, #ff4e50, #f9d423); /* rojo a naranja */
      color: white;
      padding: 20px 0;
      text-align: center;
    }
    .digisalud-logo {
      font-size: 2rem;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .digisalud-icon {
      font-size: 1.8rem;
    }
    .fuente1{
      color: #ff4e50;
    }
    .select2-container .select2-selection--single {
      height: calc(2.5rem + 2px);
      padding: 0.375rem 0.75rem;
    }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">  <header class="digisalud-header">
  <div class="container">
    <div class="digisalud-logo">
      Digisalud
      <span class="digisalud-icon">🔄</span> <!-- Puedes reemplazar por un SVG o ícono real -->
    </div>
  </div>
</header>
<div class="container">
    <div class="header mt-4">
        <h4 class="fuente1">Bienvenid@, <strong>{{ usuario }}</strong></h4>
        <a href="/logout" class="btn btn-outline-danger btn-sm">Cerrar sesión</a>
    </div>
 
  <div class="card mt-4">
        <div class="card-body">

        <form id="uploadForm">
          <!-- País -->
          <div class="mb-3">
            <label for="country" class="form-label">País</label>
            <select class="form-select" id="country" name="country" required>
              <option value="">-- Seleccionar --</option>
              <option value="vzla">Venezuela</option>
              <option value="colombia">Colombia</option>
              <option value="elsalvador">El Salvador</option>
            </select>
          </div>

          <!-- Actividad -->
          <div class="mb-3">
            <label for="actividad" class="form-label">Actividad</label>
            <select class="form-select" id="actividad" name="actividad" required>
              <option value="">-- Seleccionar --</option>
              <option value="jornada">Jornada</option>
              <option value="centro">Centro</option>
            </select>
          </div>

        
          <!-- Tipo de carga -->
          <div class="mb-3">
            <label for="dataType" class="form-label">Tipo de Carga</label>
            <select class="form-select" id="dataType" name="dataType" required>
              <option value="">-- Seleccionar --</option>
              <option value="beneficiarios">Beneficiarios</option>
              <option value="pesquisas">Pesquisas</option>
            </select>
          </div>
          <!-- Destino (se inyecta dinámicamente) -->
          <div class="mb-3" id="destinoContainer"></div>

          <!-- Subtipo de pesquisa -->
          <div class="mb-3" id="pesquisaTypeGroup" style="display: none;">
            <label for="pesquisaType" class="form-label">Tipo de Pesquisa</label>
            <select class="form-select" id="pesquisaType" name="pesquisaType">
              <option value="">-- Seleccionar --</option>
              <option value="antropometria">Antropometría</option>
              <option value="sanguineo">Sanguíneo</option>
            </select>
          </div>

          <!-- Archivo Excel -->
          <div class="mb-3">
            <label for="excelFile" class="form-label">Archivo Excel</label>
            <input type="file" class="form-control" id="excelFile" name="file" accept=".xlsx,.xls" required>
          </div>

          <button type="submit" class="btn btn-primary">Cargar</button>
        </form>

        <div class="mt-3" id="feedback"></div>
  </div>
  </div>
  </div>
<script>
    if (window.history.replaceState) {
        window.history.replaceState(null, null, window.location.href);
    }

    window.onpageshow = function(event) {
        if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
            window.location.reload();
        }
    };
</script>
 

  <script>
    // Mostrar u ocultar subtipo si es pesquisa
    document.getElementById('dataType').addEventListener('change', function () {
      const group = document.getElementById('pesquisaTypeGroup');
      group.style.display = (this.value === 'pesquisas') ? 'block' : 'none';
    });

    // Cargar destinos según actividad
    const actividadSelect = document.getElementById('actividad');
    const paisSelect = document.getElementById('country');

    actividadSelect.addEventListener('change', async () => {
      const pais = paisSelect.value;
      const actividad = actividadSelect.value;

      if (pais && actividad) {
        const response = await fetch(`/api/opciones?pais=${pais}&actividad=${actividad}`);
        const data = await response.json();

        let html = `<label for="busqueda-select" class="form-label">Selecciona ${actividad}</label>`;
        html += `<select class="form-select" id="destinoSelect" name="destino" required >`;
        html += `<option value="">-- Seleccionar --</option>`;

        data.forEach(item => {
          html += `<option value="${item.id}" data-tokens="${item.nombre}">ID:${item.id} - ${item.nombre} (Inst: ${item.institucion_id})</option>`;
        });

        html += `</select>`;
        document.getElementById('destinoContainer').innerHTML = html;
          // Activar Select2 después de insertar el select
        $('#destinoSelect').select2({
          placeholder: "-- Seleccionar --",
          allowClear: true,
          width: '100%'
        });
      }
    });
  
  </script>

  <script>
    document.getElementById('uploadForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const feedback = document.getElementById('feedback');
      feedback.innerHTML = '<div class="alert alert-info">Procesando...</div>';

      const formData = new FormData();
      const pais = document.getElementById('country').value;
      const actividad = document.getElementById('actividad').value;
      const tipoCarga = document.getElementById('dataType').value;
      const pesquisaType = document.getElementById('pesquisaType').value;
      const destinoSelect = document.getElementById('destinoSelect');
      const destinoId = destinoSelect ? destinoSelect.value : null;
      const institucionId = destinoSelect ? destinoSelect.options[destinoSelect.selectedIndex].text.match(/Inst: (\d+)/)?.[1] : null;
      const fileInput = document.getElementById('excelFile');

      if (!destinoId || !institucionId) {
        feedback.innerHTML = '<div class="alert alert-danger">Debe seleccionar un destino válido.</div>';
        return;
      }

      formData.append('file', fileInput.files[0]);
      formData.append('pais', pais);
      formData.append('actividad', actividad);
      formData.append('destino_id', destinoId);
      formData.append('institucion_id', institucionId);

      let endpoint = "";

      if (tipoCarga === "beneficiarios") {
        endpoint = "/api/cargar_excel";
      } else if (tipoCarga === "pesquisas") {
        if (pesquisaType === "antropometria") {
          endpoint = "/api/cargar_excel_pesquisa_antropometrica";
        } else if (pesquisaType === "sanguineo") {
          endpoint = "/api/cargar_excel_pesquisa_sanguinea";  // futuro
        } else {
          feedback.innerHTML = '<div class="alert alert-danger">Debe seleccionar el tipo de pesquisa.</div>';
          return;
        }
      } else {
        feedback.innerHTML = '<div class="alert alert-danger">Debe seleccionar el tipo de carga.</div>';
        return;
      }

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (result.status === 'ok') {
          let html = `<div class="alert alert-success"><strong>Carga exitosa.</strong><br>`;

          if (tipoCarga === "beneficiarios") {
            html += `Personas: ${result.insertados.personas}<br>
                     Pacientes: ${result.insertados.pacientes}<br>
                     Escolaridades: ${result.insertados.escolaridades}<br>
                     Autorizaciones: ${result.insertados.autorizaciones}<br>
                     Familiares: ${result.insertados.familiares}`;
          } else {
            html += `Registros de pesquisas insertados: ${result.insertados}`;
          }

          html += `</div>`;

          if (result.errores && result.errores.length > 0) {
            html += `<div class="alert alert-warning"><strong>Advertencias:</strong><ul>`;
            result.errores.forEach(item => {
              html += `<li>${item}</li>`;
            });
            html += `</ul></div>`;
          }

          feedback.innerHTML = html;
        } else {
          feedback.innerHTML = `<div class="alert alert-danger">Error: ${result.mensaje}</div>`;
        }
      } catch (error) {
        feedback.innerHTML = `<div class="alert alert-danger">Error inesperado: ${error.message}</div>`;
      }
    });
  </script>
    <footer class="text-white text-center py-3 mt-auto">
      © Copyright 2025. Derechos reservados.
    </footer>
</body>
</html>

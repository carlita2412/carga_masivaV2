<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carga Masiva - Digisalud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            margin-top: 3rem;
            box-shadow: 0 0.25rem 0.5rem rgba(0, 0, 0, 0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            height: 50px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header mt-4">
        <h4 class="text-success">Bienvenido, <strong>{{ usuario }}</strong></h4>
        <a href="/logout" class="btn btn-outline-danger btn-sm">Cerrar sesión</a>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <h2 class="card-title text-center mb-4">Carga Masiva de Datos</h2>
            <form id="form-carga" method="post" action="/api/cargar_excel" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="pais" class="form-label">País</label>
                    <select name="pais" id="pais" class="form-select" required>
                        <option value="">-- Seleccionar --</option>
                        <option value="vzla">Venezuela</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="actividad" class="form-label">Actividad</label>
                    <select name="actividad" id="actividad" class="form-select" required>
                        <option value="">-- Seleccionar --</option>
                        <option value="centro">Centro</option>
                        <option value="jornada">Jornada</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="destino_id" class="form-label">Tipo de Carga</label>
                    <select name="destino_id" id="destino_id" class="form-select" required>
                        <option value="">-- Seleccionar --</option>
                        <!-- opciones dinámicas JS -->
                    </select>
                </div>

                <input type="hidden" name="institucion_id" id="institucion_id" value="0">

                <div class="mb-3">
                    <label for="file" class="form-label">Archivo Excel</label>
                    <input type="file" class="form-control" name="file" id="file" accept=".xlsx" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Cargar</button>
            </form>
        </div>
    </div>
</div>

<!-- Scripts -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    const paisSelect = document.getElementById("pais");
    const actividadSelect = document.getElementById("actividad");
    const destinoSelect = document.getElementById("destino_id");
    const institucionIdInput = document.getElementById("institucion_id");

    function cargarOpciones() {
        const pais = paisSelect.value;
        const actividad = actividadSelect.value;

        if (!pais || !actividad) return;

        fetch(`/api/opciones?pais=${pais}&actividad=${actividad}`)
            .then(res => res.json())
            .then(data => {
                destinoSelect.innerHTML = '<option value="">-- Seleccionar --</option>';
                data.forEach(opt => {
                    const option = document.createElement("option");
                    option.value = opt.id;
                    option.text = opt.nombre;
                    option.setAttribute("data-inst", opt.institucion_id);
                    destinoSelect.appendChild(option);
                });
            });
    }

    paisSelect.addEventListener("change", cargarOpciones);
    actividadSelect.addEventListener("change", cargarOpciones);
    destinoSelect.addEventListener("change", () => {
        const selected = destinoSelect.selectedOptions[0];
        institucionIdInput.value = selected ? selected.getAttribute("data-inst") : "0";
    });
});
</script>

</body>
</html>

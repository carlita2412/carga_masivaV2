<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - DIGISALUD</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        
        body {
            background-color: #f8f9fa;
        }
        .login-container {
            max-width: 400px;
            margin: auto;
            margin-top: 80px;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1);
        }
        .logo-img {
            width: 150px;
            margin-bottom: 10px;
        }
        footer{
        background-color: #2D3748 !important;
        color: white !important;
    }
  
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <main class="container my-4 flex-grow-1">
    <div class="flex-grow-1 login-container text-center">
         
        <img src="{{ request.url_for('static', path='img/digisalud.png') }}" alt="DIGISALUD" class="logo-img">
        <h4 class="mb-4">Ingresa al sistema</h4>

        <form method="post" action="/login">
            <div class="mb-3 text-start">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" name="username" id="username" class="form-control" required>
            </div>
            <div class="mb-3 text-start">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" name="password" id="password" class="form-control" required>
            </div>

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
        </form>
    </div>
    </main>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <footer class="text-white text-center py-3 mt-auto">
        © Copyright 2025. Derechos reservados.
      </footer>
</body>
</html>

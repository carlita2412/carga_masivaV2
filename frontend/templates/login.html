<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - DIGISALUD</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        :root{
            --ds-coral:#ff5c57;
            --ds-orange:#f5a623;
            --ds-ink:#263244;
            --ds-muted:#667085;
        }

        body {
            margin:0;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            background:linear-gradient(135deg, var(--ds-coral), var(--ds-orange));
            font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
        }

        main{
            flex:1;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
        }

        .login-container {
            width:100%;
            max-width: 400px;
            padding: 36px 32px;
            background-color: white;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(16,24,40,.25);
        }

        .logo-img {
            width: 130px;
            margin-bottom: 12px;
        }

        .login-subtitle{
            color:var(--ds-muted);
            font-size:.92rem;
            margin-bottom:1.75rem;
        }

        .form-label{
            font-weight:700;
            font-size:.88rem;
            color:var(--ds-ink);
        }

        .form-control{
            min-height:46px;
            border-radius:10px;
            border-color:#d0d5dd;
        }

        .form-control:focus{
            border-color:#ff9a95;
            box-shadow:0 0 0 .2rem rgba(255,92,87,.15);
        }

        .password-wrap{position:relative}

        .toggle-password{
            position:absolute;
            right:12px;
            top:50%;
            transform:translateY(-50%);
            background:none;
            border:none;
            color:var(--ds-muted);
            cursor:pointer;
            padding:4px;
        }

        .btn-login{
            background:linear-gradient(90deg,var(--ds-coral),#ff7f50);
            border:0;
            color:#fff;
            font-weight:700;
            border-radius:10px;
            padding:.75rem 1rem;
            min-height:48px;
        }

        .btn-login:hover{color:#fff;filter:brightness(.98)}

        .btn-login:disabled{opacity:.7}

        footer{
            background-color: rgba(0,0,0,.15);
            color: white;
        }
    </style>
</head>
<body>
    <main>
    <div class="login-container text-center">

        <img src="{{ request.url_for('static', path='img/digisalud.png') }}" alt="DIGISALUD" class="logo-img">
        <h4 class="mb-1 fw-bold" style="color:var(--ds-ink)">Bienvenido</h4>
        <p class="login-subtitle">Ingresa tus credenciales para acceder al sistema</p>

        <form method="post" action="/login" id="loginForm" novalidate>
            <div class="mb-3 text-start">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" name="username" id="username" class="form-control" autocomplete="username" autofocus required>
            </div>
            <div class="mb-3 text-start">
                <label for="password" class="form-label">Contraseña</label>
                <div class="password-wrap">
                    <input type="password" name="password" id="password" class="form-control" autocomplete="current-password" required>
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña" tabindex="-1">
                        <i class="bi bi-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            {% if error %}
                <div class="alert alert-danger text-start d-flex align-items-center gap-2" role="alert">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span>{{ error }}</span>
                </div>
            {% endif %}

            <button type="submit" class="btn btn-login w-100" id="btnLogin">
                <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar sesión
            </button>
        </form>
    </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById('togglePassword').addEventListener('click', function () {
            const input = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            icon.classList.toggle('bi-eye', !isHidden);
            icon.classList.toggle('bi-eye-slash', isHidden);
        });

        document.getElementById('loginForm').addEventListener('submit', function () {
            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Verificando...';
        });
    </script>

    <footer class="text-white text-center py-3">
        © Copyright 2025. Derechos reservados.
      </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}DIGISALUD{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <style>
    body {
      overflow-x: hidden;
      background-color: #f8f9fa;
    }

    #sidebar {
      width: 250px;
      background-color: #2D3748 !important;
      color: white;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      padding-top: 56px;
      transition: transform 0.3s ease;
    }

    #sidebar.hidden {
      transform: translateX(-100%);
    }

    #sidebar a {
      display: block;
      color: white;
      padding: 12px 20px;
      text-decoration: none;
    }

    #sidebar a:hover {
      background-color: #70757b;
    }

    .topbar {
      background: linear-gradient(to right, #f45d4c, #ffa736);
      height: 56px;
    }

    .main-content {
      margin-left: 250px;
      padding: 70px 20px 20px;
    }

    .hamburger {
      font-size: 24px;
      background: none;
      border: none;
      color: white;
    }

    .logo {
      height: 50px;
    }

    footer {
      background-color: #2D3748;
      color: white;
    }

    .digisalud-header {
      background: linear-gradient(to right, #ff4e50, #f9d423);
      color: white;
      padding: 20px 0;
      text-align: center;
    }

    .digisalud-logo {
      font-size: 2rem;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .fuente1 {
      color: #ff4e50;
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

<header class="digisalud-header">
  <div class="container">
    <nav class="navbar topbar fixed-top px-3 d-flex align-items-center">
      <button class="hamburger me-3" onclick="toggleSidebar()">☰</button>
      <div class="digisalud-logo">
        <span class="digisalud-icon">
          <img src="{{ request.url_for('static', path='img/digisalud.png') }}" alt="DIGISALUD" class="logo">
        </span>
      </div>
    </nav>
  </div>
</header> 

<div id="sidebar" class="hidden">
  <a href="/carga">Inicio</a>
  <a href="/carga">Carga Masiva</a>
      <!--<a href="#">Reportes</a>-->

       <!-- JRORNADAS (Desplegable) -->
<!-- Jornadas (Desplegable) -->
<a class="d-flex justify-content-between align-items-center" data-bs-toggle="collapse" href="#submenuJornadas" role="button">
  <i class="bi bi-calendar-event text-white"></i> Jornadas
  <span class="ms-2">▼</span>
</a>
<div class="collapse ps-3" id="submenuJornadas">
  <a href="/jornadas/v2">Gestionar Jornadas</a>
</div>

    <!-- Usuarios (Desplegable) -->
 
<a  class="d-flex justify-content-between align-items-center"  href="/usuarios/v2" ><i class="bi bi-person-gear"></i>Gestionar Usuarios</a>
  

  <a class="d-flex justify-content-between align-items-center" data-bs-toggle="collapse" href="#submenuDescargas" role="button">
   <i class="bi bi-download"></i> Descargas <span class="ms-2">▼</span>
  </a>
  <div class="collapse ps-3" id="submenuDescargas">
    <a href="/carga_masiva/descargas/beneficiario" download>Plantilla Beneficiario</a>
    <a href="/carga_masiva/descargas/antropometria" download>Plantilla Antropometría</a>
    <a href="/carga_masiva/descargas/sanguineo" download>Plantilla Sanguíneo</a>
    <a href="/carga_masiva/descargas/manual" download>Manual de Usuario</a>
  </div>

  <a href="/logout"><i class="bi bi-power"></i> Cerrar sesión</a>
</div>

<div class="main-content" id="mainContent">
  {% block content %}{% endblock %}
</div>

<footer class="text-white text-center py-3 mt-auto">
  © Copyright 2025. Derechos reservados.
</footer>

<!-- Bootstrap Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function toggleSidebar() {
    const sidebar = document.getElementById("sidebar");
    const mainContent = document.getElementById("mainContent");

    sidebar.classList.toggle("hidden");
    mainContent.classList.toggle("expanded");
  }
</script>


<!-- Modal de éxito -->
<div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-danger">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title" id="successModalLabel">Éxito</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body" id="modalMessage">
        <!-- Mensaje dinámico -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal" onclick="location.reload()">Aceptar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal genérico para actualizar datos -->
<div class="modal fade" id="inputModal" tabindex="-1" aria-labelledby="inputModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content border-info">
      <div class="modal-header bg-info text-white">
        <h5 class="modal-title" id="inputModalLabel">Actualizar dato</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <input type="text" id="inputModalField" class="form-control" placeholder="">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-info" id="inputModalAceptar">Aceptar</button>
      </div>
    </div>
  </div>
</div>




<script>
  window.onpageshow = function(event) {
    if (event.persisted) {
      window.location.reload();
    }
  };
</script>

</body>
</html>
